plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.soymas.app'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.soymas.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave debug para poder instalar el APK directamente (sin Play Store)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
