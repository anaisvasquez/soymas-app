plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.soymas.app'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.soymas.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            // La clave llega por GitHub Actions (secretos); sin ella se usa la clave debug
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'quadratech'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
